<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAPE ECOSYSTEM</title>
    <style class="global-spatial">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
        }

        html, body, .grape-spatial {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1c2340 0%, #171b30 60%, #2a1f4d 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }
    </style>
    <script type="module" class="structure-spatial">
        const routes = {
            '#space': { path: './sp/space.js', title: 'Spatial Room' },
            '#friends': { path: './sp/friends.js', title: 'Friends' }
        };

        async function route() {
            if (!window.location.hash) {
                window.location.hash = '#space';
                return;
            }

            const crHash = window.location.hash;
            const mainroom = document.getElementById('spatial');
            const rInfo = routes[crHash];

            if (rInfo) {
                mainroom.innerHTML = `<div class="skeleton-loader">Syncing Grape room...</div>`;
                try {
                    document.title = rInfo.title;
                    const pageModule = await import(rInfo.path);
                    mainroom.innerHTML = pageModule.render();
                } catch (error) {
                    mainroom.innerHTML = `<div style="color: #ff5252;">Failed to load spatial component.</div>`;
                    console.error("Router error:", error);
                }
            } else {
                mainroom.innerHTML = `<div style="padding: 20px;">404 - Not found</div>`;
                document.title = "404 - Not Found";
            }

            document.querySelectorAll('.nav-left a').forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === crHash) {
                    link.classList.add('active');
                }
            });
        }

        window.addEventListener('hashchange', route);
        window.addEventListener('DOMContentLoaded', route);
    </script>
</head>
<body>
   <div class="grape-spatial">
        <header class="header">
            <div class="logo">
                <img src="" alt="Grape Logo" onerror="this.src=''">
            </div>
            <div class="logoname"><p>GRAPE</p></div>
        </header>
        <aside class="sider-left">
            <nav class="nav-left">
                <ul class="left">
                    <li>
                        <a href="#space">spatial room</a>
                    </li>
                    <li>
                        <a href="#friends">friends</a>
                    </li>
                </ul>
            </nav>
        </aside>
        <main id="spatial"></main>
   </div>
</body>
</html>
